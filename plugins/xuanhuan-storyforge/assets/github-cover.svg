<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">玄章天工｜Xuanhuan Storyforge</title>
  <desc id="cover-desc">曜石墨色横幅上，金色书页、朱砂火种与笔锋构成标志，搭配宣纸纹理、远山与星轨。</desc>
  <defs>
    <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B11"/>
      <stop offset="0.55" stop-color="#101621"/>
      <stop offset="1" stop-color="#07090E"/>
    </linearGradient>
    <radialGradient id="cover-halo" cx="0.28" cy="0.47" r="0.56">
      <stop offset="0" stop-color="#C7462E" stop-opacity="0.22"/>
      <stop offset="0.42" stop-color="#D9AE5F" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4DEA4"/>
      <stop offset="0.48" stop-color="#D9AE5F"/>
      <stop offset="1" stop-color="#9B6725"/>
    </linearGradient>
    <linearGradient id="cover-fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#92281F"/>
      <stop offset="0.55" stop-color="#C7462E"/>
      <stop offset="1" stop-color="#F0A247"/>
    </linearGradient>
    <linearGradient id="cover-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9AE5F" stop-opacity="0.88"/>
      <stop offset="0.6" stop-color="#D9AE5F" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D9AE5F" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cover-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F3E7C5" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <pattern id="cover-paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.7" fill="#F3E7C5" opacity="0.08"/>
      <circle cx="9" cy="8" r="0.45" fill="#D9AE5F" opacity="0.07"/>
    </pattern>
    <filter id="cover-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="cover-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="cover-frame">
      <rect x="16" y="16" width="1568" height="568" rx="32"/>
    </clipPath>
  </defs>

  <rect width="1600" height="600" rx="36" fill="url(#cover-bg)"/>
