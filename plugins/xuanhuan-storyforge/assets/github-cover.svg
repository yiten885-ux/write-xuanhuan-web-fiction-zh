    <rect width="1600" height="600" fill="url(#cover-halo)"/>
    <rect width="1600" height="600" fill="url(#cover-grid)"/>
    <rect width="1600" height="600" fill="url(#cover-paper)" opacity="0.55"/>

    <circle cx="1370" cy="110" r="280" fill="none" stroke="#D9AE5F" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="1370" cy="110" r="220" fill="none" stroke="#D9AE5F" stroke-opacity="0.055" stroke-width="1"/>
    <path d="M1120 148C1262 70 1436 72 1592 172" fill="none" stroke="#D9AE5F" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle cx="1212" cy="105" r="3" fill="#F4DEA4" opacity="0.62"/>
    <circle cx="1462" cy="192" r="2" fill="#F4DEA4" opacity="0.42"/>
