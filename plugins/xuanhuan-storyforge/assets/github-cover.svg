      <rect x="38" y="38" width="436" height="436" rx="76" fill="none" stroke="url(#cover-gold)" stroke-width="8"/>
      <path d="M105 320c50-23 99-20 151 12V214c-50-29-99-31-151-9v115Z" fill="none" stroke="url(#cover-gold)" stroke-width="15" stroke-linejoin="round"/>
      <path d="M407 320c-50-23-99-20-151 12V214c50-29 99-31 151-9v115Z" fill="none" stroke="url(#cover-gold)" stroke-width="15" stroke-linejoin="round"/>
      <path d="M256 213v158" fill="none" stroke="#E8C876" stroke-width="10" stroke-linecap="round"/>
      <path d="M210 282c-15-51 32-73 30-122 47 38 31 79 55 100 7-22 24-34 34-51 18 52-2 116-72 131-54-8-77-28-77-61 0-22 13-42 31-55-2 19 0 40-1 58Z" fill="url(#cover-fire)" stroke="#F2C86B" stroke-width="7" stroke-linejoin="round"/>
      <path d="M232 294c-5-25 15-39 24-60 19 21 12 41 25 55 7-10 12-18 15-27 11 32-6 58-40 66-27-6-37-17-37-32 0-9 5-18 13-25-1 8 0 16 0 23Z" fill="#F6B44A"/>
      <path d="M124 383h264" stroke="url(#cover-gold)" stroke-width="14" stroke-linecap="round"/>
      <path d="m326 144 51-51 14 14-51 51-31 12 17-26Z" fill="url(#cover-gold)"/>
    </g>

    <g transform="translate(590 0)">
      <text x="0" y="217" fill="#F3E7C5" font-size="98" font-weight="700" letter-spacing="14" font-family="Noto Serif SC, Source Han Serif SC, Songti SC, STSong, serif">玄章天工</text>
      <rect x="2" y="254" width="650" height="2" rx="1" fill="url(#cover-rule)"/>
      <text x="2" y="306" fill="#D9AE5F" font-size="27" font-weight="600" letter-spacing="9" font-family="Inter, SF Pro Display, Helvetica Neue, Arial, sans-serif">XUANHUAN STORYFORGE</text>
      <text x="2" y="376" fill="#C8C0AE" font-size="28" font-weight="400" letter-spacing="2.4" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif">中文玄幻网文 · 规划 · 创作 · 续写 · 连续性审校</text>
      <g transform="translate(2 418)" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="16" letter-spacing="2">
        <rect width="178" height="42" rx="21" fill="#D9AE5F" fill-opacity="0.09" stroke="#D9AE5F" stroke-opacity="0.24"/>
        <text x="89" y="27" text-anchor="middle" fill="#DCC995">长篇状态事务</text>
        <g transform="translate(196 0)">
          <rect width="178" height="42" rx="21" fill="#D9AE5F" fill-opacity="0.09" stroke="#D9AE5F" stroke-opacity="0.24"/>
          <text x="89" y="27" text-anchor="middle" fill="#DCC995">读者正文隔离</text>
        </g>
        <g transform="translate(392 0)">
          <rect width="178" height="42" rx="21" fill="#D9AE5F" fill-opacity="0.09" stroke="#D9AE5F" stroke-opacity="0.24"/>
          <text x="89" y="27" text-anchor="middle" fill="#DCC995">确定性审计</text>
        </g>
      </g>
    </g>
