    <path d="M0 530C166 486 302 505 440 527C612 553 750 506 894 492C1080 474 1250 523 1418 489C1480 477 1540 458 1600 436V600H0Z" fill="#070A0F"/>
    <path d="M610 476C738 433 846 426 965 448C1089 470 1208 464 1327 427" fill="none" stroke="#D9AE5F" stroke-opacity="0.075" stroke-width="2"/>

    <ellipse cx="330" cy="305" rx="235" ry="226" fill="#C7462E" opacity="0.06" filter="url(#cover-glow)"/>

