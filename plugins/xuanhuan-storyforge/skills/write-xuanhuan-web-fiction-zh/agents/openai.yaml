interface:
  display_name: "玄章天工｜Xuanhuan Storyforge"
  short_description: "系统规划、创作、续写、重写与审校中文玄幻网文及开篇前三章"
  default_prompt: "使用 $write-xuanhuan-web-fiction-zh 按目标平台选择爽点模式并完成去模板化审校：累积执行既有五锁、06–10及前三万字九项留存锁、逐章节奏二十项硬锁与连续性状态事务；保持单场景POV及知情、时间、空间一致，逐章净正文2000–3200字符；正文、state、QA三分离，约束ID和自检只写独立QA侧车，四拍拆解也须隔离，重写标记同样隔离，示例不进入通用门禁。"
